# Prueba y despliega API Gateway + Lambda de ingesta (deploy/aws-lambda) en AWS.
#
# Configuración única en GitHub (Settings -> Secrets and variables -> Actions):
#   secreto   AWS_DEPLOY_ROLE_ARN   rol de IAM con confianza OIDC hacia este repositorio (ver docs/despliegue-aws-lambda.md)
#   variables AWS_REGION, BACKEND_URL, VPC_ID, SUBNET_IDS (separadas por comas), BACKEND_SG_ID,
#             EC2_INSTANCE_ID y DB_INSTANCE_ID (estas dos activan el apagado nocturno)
name: Lambda de ingesta

on:
  push:
    branches: [main]
    paths: ["deploy/aws-lambda/**", ".github/workflows/lambda-ingesta.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC: GitHub obtiene credenciales temporales de AWS, sin claves guardadas
  contents: read

concurrency: lambda-ingesta

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws-lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prueba del proxy
        run: python test_ingest_proxy.py
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Desplegar
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_IDS: ${{ vars.SUBNET_IDS }}
          BACKEND_SG_ID: ${{ vars.BACKEND_SG_ID }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DB_INSTANCE_ID: ${{ vars.DB_INSTANCE_ID }}
        run: |
          # SAM rechaza un parámetro vacío ("Clave="): los opcionales solo se pasan si la variable existe.
          params=("BackendUrl=$BACKEND_URL" "VpcId=$VPC_ID" "SubnetIds=$SUBNET_IDS" "BackendSecurityGroupId=$BACKEND_SG_ID")
          [ -n "$EC2_INSTANCE_ID" ] && params+=("Ec2InstanceId=$EC2_INSTANCE_ID")
          [ -n "$DB_INSTANCE_ID" ] && params+=("DbInstanceId=$DB_INSTANCE_ID")
          sam deploy --stack-name capacidadbus-ingesta --resolve-s3 --capabilities CAPABILITY_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "${params[@]}"
      - name: URL para los buses
        run: >
          aws cloudformation describe-stacks --stack-name capacidadbus-ingesta
          --query "Stacks[0].Outputs[?OutputKey=='IngestUrl'].OutputValue" --output text
