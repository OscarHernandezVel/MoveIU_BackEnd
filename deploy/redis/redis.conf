# =====================================================================================
# Redis del core-service: configuración de referencia para producción.
# Ajuste rutas y tamaños. Los secretos van en users.acl (fuera del control de versiones).
# =====================================================================================

# --- Red: solo interfaces privadas; nada de acceso sin autenticar ---------------------
bind 0.0.0.0
protected-mode yes
# el puerto sin cifrar queda cerrado: solo TLS
port 0
tls-port 6379
tls-cert-file /etc/redis/tls/server.crt
tls-key-file  /etc/redis/tls/server.key
tls-ca-cert-file /etc/redis/tls/ca.crt
# 'yes' si además exige certificado de cliente (mTLS)
tls-auth-clients optional
tls-protocols "TLSv1.2 TLSv1.3"

# --- Autenticación y permisos (ACL) --------------------------------------------------
aclfile /etc/redis/users.acl
# La cuenta 'default' queda deshabilitada dentro de users.acl.

# --- Disponibilidad y durabilidad ----------------------------------------------------
# AOF: sobrevive a un reinicio sin perder las últimas escrituras
appendonly yes
# como mucho 1 s de datos en riesgo
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 100
# el primario no acepta escrituras si se quedó sin réplica (evita perder datos en un split-brain)
min-replicas-to-write 1
min-replicas-max-lag 10

# --- Memoria: NUNCA expulsar datos en silencio ---------------------------------------
# Bloqueos, deduplicación e historial de sesiones dejarían de ser fiables si Redis borrara claves
# por falta de memoria. Con noeviction, Redis rechaza la escritura y el servicio responde 503.
maxmemory 1gb
maxmemory-policy noeviction

# --- Endurecimiento -------------------------------------------------------------------
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
timeout 0
tcp-keepalive 60
latency-monitor-threshold 100
